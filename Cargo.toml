[package]
name = "pasli-zemin"
version = "0.2.0"
edition = "2021"
authors = ["Ercan ER <ercaner1988@gmail.com>"]
description = "Pasli Zemin: 4 AI ortami (Claude Code, Claude Desktop, OpenAI Codex, Google Antigravity) icin donanim bekcisi (QoS/RAM trim), Windows Work IQ ve Bun MCP yonetimi"
license = "MIT"
repository = "https://github.com/Ercaner1988/pasli-zemin"

[lib]
name = "pasli_zemin"
path = "src/lib.rs"

[[bin]]
name = "pasli-zemin"
path = "src/main.rs"

[[bin]]
name = "claude-code-setup"
path = "src/bin/claude_code_setup.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
fastembed = { version = "4.9", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
regex = "1.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[dev-dependencies]
divan = { version = "5.0.2", package = "codspeed-divan-compat" }
tempfile = "3.8"

[[bench]]
name = "memory_engine"
harness = false

[[bench]]
name = "memory_search"
harness = false

[[bench]]
name = "security"
harness = false

[[bench]]
name = "mcp_protocol"
harness = false
